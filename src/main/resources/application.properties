spring.profiles.active=dev
# Local secrets (DB_PASSWORD, JWT_SECRET_KEY, API keys …) can live in a git-ignored .env file in the
# folder the server is started from. Real environment variables still take priority. See .env.example.
spring.config.import=optional:file:.env[.properties]
# Question image uploads (converted to WebP server-side)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sender shown on outgoing emails (activation, password reset, result slips).
# Use an address on a domain verified in Mailjet (SPF/DKIM); @gmail.com senders are often rejected or sent to spam.
app.mail.from-address=${MAIL_FROM_ADDRESS:optimusinforservice@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:EduApp Support}

# Address of the web app, printed on transcripts / report cards as the verification link.
# The Super Admin can override it under Institution settings.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Developers are stored in the database: the Super Admin adds the first one, then developers manage the list.
# Local testing without email only: print developer sign-in codes to the server log.
app.developer.log-codes=${DEVELOPER_LOG_CODES:false}
# Email the developer(s) when a new server/browser error appears.
app.monitoring.email-alerts=${MONITORING_EMAIL_ALERTS:true}

# Paystack: school fees by card and Mobile Money. Secret key from Paystack > Settings > API Keys & Webhooks
# (sk_test_... while testing, sk_live_... in production). Leave it unset to keep online payment off.
# Webhook URL to enter on that Paystack page: https://<backend-host>/api/payments/paystack/webhook
# Students return to <app.frontend-url>/user-dashboard/fees after paying.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
paystack.currency=${PAYSTACK_CURRENCY:GHS}
