spring.profiles.active=prod
# Local secrets (DB_PASSWORD, JWT_SECRET_KEY, API keys …) can live in a git-ignored .env file in the
# folder the server is started from. Real environment variables still take priority. See .env.example.
spring.config.import=optional:file:.env[.properties]
# Uploads: course materials (files up to the developer's limit, 25 MB by default, several at once);
# question images and profile photos keep their own 5 MB limit in QuestionImageService.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=260MB

# A full exam hall: compress JSON replies (question lists shrink to a fraction) and allow more
# database connections than the default 10. Raise DB_POOL_SIZE only as far as the MySQL plan allows.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=2KB
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}
# Logs the stack trace of any code holding a connection longer than this (ms; 0 = off). Set DB_LEAK_DETECTION_MS=20000 on Render to find pool hogs.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}
# Open-in-view is registered by config/OpenInViewConfig instead, so file downloads can skip it.
spring.jpa.open-in-view=false

# Sender shown on outgoing emails (activation, password reset, result slips).
# Use an address on a domain verified in Mailjet (SPF/DKIM); @gmail.com senders are often rejected or sent to spam.
app.mail.from-address=${MAIL_FROM_ADDRESS:optimusinforservice@gmail.com}
# Blank = the institution's name (set by the Super Admin)
app.mail.from-name=${MAIL_FROM_NAME:}

# Address of the web app, printed on transcripts / report cards as the verification link.
# The Super Admin can override it under Institution settings.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Developers are stored in the database: the Super Admin adds the first one, then developers manage the list.
# Local testing without email only: print developer sign-in codes to the server log.
app.developer.log-codes=${DEVELOPER_LOG_CODES:false}
# Email the developer(s) when a new server/browser error appears.
app.monitoring.email-alerts=${MONITORING_EMAIL_ALERTS:true}

# Paystack: school fees by card and Mobile Money. Secret key from Paystack > Settings > API Keys & Webhooks
# (sk_test_... while testing, sk_live_... in production). Leave it unset to keep online payment off.
# Webhook URL to enter on that Paystack page: https://<backend-host>/api/payments/paystack/webhook
# Students return to the web app they paid from (request Origin, if CORS allows it), else the portal
# address from Institution settings, else app.frontend-url.
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
paystack.currency=${PAYSTACK_CURRENCY:GHS}

# Course materials: notes, assignments and students' work are kept on disk here (back this folder up with the database)
app.materials.dir=${MATERIALS_DIR:${user.home}/exam-materials}
# Claude model for marking assignments (it reads PDFs and photos of handwritten work)
materials.ai.claude.model=${MATERIALS_CLAUDE_MODEL:claude-opus-5-5}
# Optional: LibreOffice for exact PDF views of Word / PowerPoint files (found automatically in the usual places;
# Ubuntu: apt install libreoffice-nogui). Leave empty if it isn't installed: the browser draws the files instead.
app.materials.soffice=${MATERIALS_SOFFICE:}
# Models for assignment marking (the quiz settings name retired ones). Change if an account doesn't offer them.
materials.ai.gemini.model=${MATERIALS_GEMINI_MODEL:gemini-2.5-flash}
materials.ai.openai.model=${MATERIALS_OPENAI_MODEL:gpt-4.1-mini}
